{{ define "main" }}
<div class="wrap">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
    <p>Topics used on posts and talks.</p>
  </header>
  <ul class="terms">
    {{- range .Data.Terms.Alphabetical }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }}</a> <span class="num">({{ .Count }})</span></li>
    {{- end }}
  </ul>
</div>
{{ end }}
