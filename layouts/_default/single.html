{{ define "main" }}
<div class="post">
    {{ if not (eq .Type "page") }}
    <div class="post-meta">
      {{ .Date.Format "January 2, 2006" }}
    </div>
    {{ end }}
    
    <h1 class="post-title">{{ .Title }}</h1>
    
    {{ if .Params.tags }}
      <div class="post-tags">
        {{ range .Params.tags }}
          <a href="/tags/{{ . | urlize }}">#{{ . }}</a>{{ if not (eq . (index $.Params.tags (sub (len $.Params.tags) 1))) }}, {{ end }}
        {{ end }}
      </div>
    {{ end }}
    
    <div class="post-content">
      {{ .Content }}
    </div>
</div>
{{ end }}
