{{ define "main" }}
<div class="wrap">
  <header class="pagehead">
    <h1>{{ .Title }}</h1>
    <p class="pagehead__lede">Topics used on posts and talks.</p>
  </header>
  <ul class="terms">
    {{- range .Data.Terms.Alphabetical }}
    <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} <span class="v">{{ .Count }}</span></a></li>
    {{- end }}
  </ul>
</div>
{{ end }}
