{{ define "main" }}
<div class="wrap">
  <header class="pagehead">
    <h1>{{ .Title }}</h1>
    <p>Posts and talks tagged {{ .Title }}. <a href="/tags/">All tags</a></p>
  </header>
  <section class="year" aria-labelledby="term-pages">
    <h2 class="vh" id="term-pages">Tagged {{ .Title }}</h2>
    {{ partial "record-table.html" (dict "pages" .Pages.ByDate.Reverse "label" "term-pages") }}
  </section>
</div>
{{ end }}
