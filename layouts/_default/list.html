{{ define "main" }}
<div class="wrap">
  <header class="page-head">
    <h1>{{ .Title }}</h1>
  </header>
  <ol class="rows">
    {{- range .Pages.ByDate.Reverse }}
    <li class="row">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2006" }}</time>
      <div><h2 class="row__title"><a href="{{ if eq .Section "blogs" }}{{ .Params.link | default .RelPermalink }}{{ else }}{{ .RelPermalink }}{{ end }}">{{ .Title }}</a></h2></div>
      <div class="row__aside">{{ with .Params.source }}{{ . }}{{ end }}{{ with .Params.venue }}{{ . }}{{ end }}</div>
    </li>
    {{- end }}
  </ol>
</div>
{{ end }}
