{{ define "main" }}
<div class="wrap">
  <header class="pagehead">
    <h1>{{ .Title }}</h1>
  </header>
  <section class="list" aria-labelledby="list-pages">
    <h2 class="vh" id="list-pages">{{ .Title }}</h2>
    <ol class="picks">{{ range .Pages.ByDate.Reverse }}{{ partial "record.html" (dict "page" .) }}{{ end }}</ol>
  </section>
</div>
{{ end }}
