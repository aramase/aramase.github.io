<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="/"{{ if .IsHome }} aria-current="page"{{ end }}>{{ site.Title }}</a>
    <nav class="site-nav" aria-label="Primary">
      <ul>
        {{- $current := . }}
        {{- range site.Menus.main }}
        {{- $active := or ($current.IsMenuCurrent "main" .) ($current.HasMenuCurrent "main" .) (eq $current.Section .Identifier) }}
        <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{- end }}
        {{- with site.Params.social.email }}
        <li><a href="mailto:{{ . }}">Email</a></li>
        {{- end }}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" aria-pressed="false" hidden><span class="theme-toggle__box" aria-hidden="true"></span>Dark</button>
  </div>
</header>
