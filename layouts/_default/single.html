{{ define "main" }}
<div class="wrap">
  <article class="doc">
    <h1>{{ .Title }}</h1>
    {{- if ne .Type "page" }}
    <p class="doc__meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></p>
    {{- end }}
    <div class="doc__body">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
