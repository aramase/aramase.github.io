# Release ledger shown on /work/. Generated by tools/ledger; do not edit it by hand.
# Track a KEP in ledger/keps.yaml, add PRs, posts, talks and exclusions in
# ledger/overrides.yaml, then run `make ledger`.
#
# - stages and releases: kep.yaml `milestone`, up to kep.yaml `stage`, in
#   kubernetes/enhancements; a stage counts once its release is out (a v1.N.0 tag in
#   kubernetes/kubernetes);
# - first and last: the oldest and newest released stage; the page's release axis ends
#   at last, so the file changes only when the work does;
# - targets (`target: true`): a GA stage in the release in development, drawn only
#   while the KEP issue's milestone is that release and it carries lead-opted-in;
#   kep.yaml alone is not enough, it keeps a target after the release drops the KEP;
# - inDevelopment and checked: written only with a target; checked is the UTC date of the
#   run, and the site stops drawing targets 35 days after it, so an unmerged update
#   shows released stages only, never a stale target;
# - coauthors: kep.yaml `authors`, without @aramase;
# - prs, posts, talks: ledger/overrides.yaml.

kubernetes:
  first: 25   # v1.25, the first release with a stage on the ledger
  last: 37    # v1.37, the newest released stage on the ledger
  features:
    - id: kms-v2
      name: KMS v2
      kep: 3299
      path: sig-auth/3299-kms-v2-improvements
      sig: SIG Auth
      coauthors: ["ritazh"]
      stages:
        - stage: alpha
          release: 25
          prs: [111126]
          posts: ["/blogs/2022-kubernetes-1-25-kms-v2-improvements"]
        - stage: beta
          release: 27
          prs: [115123]
          posts: ["/blogs/2023-kubernetes-1-27-kms-v2-beta"]
        - stage: ga
          release: 29

    - id: structured-authn
      name: Structured authentication configuration
      kep: 3331
      path: sig-auth/3331-structured-authentication-configuration
      sig: SIG Auth
      coauthors: ["nabokihms", "enj"]
      stages:
        - stage: alpha
          release: 29
          prs: [119142, 121078]
        - stage: beta
          release: 30
          posts:
            - "/blogs/2024-kubernetes-1-30-structured-auth-beta"
            - "/blogs/jwt-kubernetes-structured-authentication"
        - stage: ga
          release: 34

    - id: image-pull-tokens
      name: Service account tokens for image pulls
      kep: 4412
      path: sig-auth/4412-projected-service-account-tokens-for-kubelet-image-credential-providers
      sig: SIG Auth
      coauthors: ["mainred"]
      stages:
        - stage: alpha
          release: 33
          prs: [128372]
          posts: ["/blogs/2025-kubernetes-1-33-workload-identity-image-pulls"]
        - stage: beta
          release: 34
          prs: [133017]
          posts: ["/blogs/2025-kubernetes-v1-34-sa-tokens-image-pulls-beta"]
          talks: ["/talks/2025-kubecon-na-sig-auth-update"]
        # No GA target: kep.yaml still lists stable: v1.38, but v1.38 dropped the KEP
        # at its readiness deadline. On 2026-10-26 the KEP issue had no milestone and
        # no lead-opted-in label.

    - id: csi-sa-tokens
      name: Service account tokens for CSI drivers
      kep: 5538
      path: sig-storage/5538-csi-sa-tokens-secrets-field
      sig: SIG Storage
      coauthors: []
      stages:
        - stage: beta
          release: 35
          prs: [134826]
          posts: ["/blogs/2026-kubernetes-v1-35-csi-sa-tokens-secrets-field-beta"]
        - stage: ga
          release: 36
          prs: [136596]

    - id: manifest-admission
      name: Manifest-based admission control
      kep: 5793
      path: sig-api-machinery/5793-manifest-based-admission-control-config
      sig: SIG API Machinery
      coauthors: ["BenTheElder"]
      stages:
        - stage: alpha
          release: 36
          prs: [137346]
          posts: ["/blogs/2026-kubernetes-v1-36-manifest-based-admission-control"]
        - stage: beta
          release: 37

