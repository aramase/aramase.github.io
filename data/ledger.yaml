# Release ledger shown on /work/.
#
# Every fact here was checked against a source, never written from memory:
# - stages and releases: kep.yaml `milestone` and `status` in kubernetes/enhancements
#   (upstream master ea3e81a0d41d, 2026-10-24), cross-checked with the feature gate
#   versions in kubernetes/kubernetes v1.37.1;
# - authors: kep.yaml `authors`;
# - prs: merged kubernetes/kubernetes PRs authored by @aramase, listed in the KEP's
#   Implementation History or found with `gh search prs --author aramase`;
# - posts and talks: pages already on this site, attached to the stage that was
#   current when they were published;
# - targets (`target: true`, a stage in a release still in development): only when
#   the KEP issue's current milestone is that release and it carries the
#   lead-opted-in label. kep.yaml alone is not enough: it keeps a target after the
#   release drops the KEP.
# Leave out anything that cannot be verified the same way.

kubernetes:
  first: 25   # v1.25, the first release with a stage on the ledger
  last: 38    # v1.38, in development (v1.38.0-alpha.2 tagged, no v1.38.0)
  inDevelopment: 38
  features:
    - id: kms-v2
      name: KMS v2
      kep: 3299
      path: sig-auth/3299-kms-v2-improvements
      sig: SIG Auth
      coauthors: ["ritazh"]
      stages:
        - stage: alpha
          release: 25
          prs: [111126]
          posts: ["/blogs/2022-kubernetes-1-25-kms-v2-improvements"]
        - stage: beta
          release: 27
          prs: [115123]
          posts: ["/blogs/2023-kubernetes-1-27-kms-v2-beta"]
        - stage: ga
          release: 29

    - id: structured-authn
      name: Structured authentication configuration
      kep: 3331
      path: sig-auth/3331-structured-authentication-configuration
      sig: SIG Auth
      coauthors: ["nabokihms", "enj"]
      stages:
        - stage: alpha
          release: 29
          prs: [119142, 121078]
        - stage: beta
          release: 30
          posts:
            - "/blogs/2024-kubernetes-1-30-structured-auth-beta"
            - "/blogs/jwt-kubernetes-structured-authentication"
        - stage: ga
          release: 34

    - id: image-pull-tokens
      name: Service account tokens for image pulls
      kep: 4412
      path: sig-auth/4412-projected-service-account-tokens-for-kubelet-image-credential-providers
      sig: SIG Auth
      coauthors: ["mainred"]
      stages:
        - stage: alpha
          release: 33
          prs: [128372]
          posts: ["/blogs/2025-kubernetes-1-33-workload-identity-image-pulls"]
        - stage: beta
          release: 34
          prs: [133017]
          posts: ["/blogs/2025-kubernetes-v1-34-sa-tokens-image-pulls-beta"]
          talks: ["/talks/2025-kubecon-na-sig-auth-update"]
        # No GA target: kep.yaml still lists stable: v1.38, but v1.38 dropped the KEP
        # at its readiness deadline. On 2026-10-26 the KEP issue had no milestone and
        # no lead-opted-in label.

    - id: csi-sa-tokens
      name: Service account tokens for CSI drivers
      kep: 5538
      path: sig-storage/5538-csi-sa-tokens-secrets-field
      sig: SIG Storage
      coauthors: []
      stages:
        - stage: beta
          release: 35
          prs: [134826]
          posts: ["/blogs/2026-kubernetes-v1-35-csi-sa-tokens-secrets-field-beta"]
        - stage: ga
          release: 36
          prs: [136596]

    - id: manifest-admission
      name: Manifest-based admission control
      kep: 5793
      path: sig-api-machinery/5793-manifest-based-admission-control-config
      sig: SIG API Machinery
      coauthors: ["BenTheElder"]
      stages:
        - stage: alpha
          release: 36
          prs: [137346]
          posts: ["/blogs/2026-kubernetes-v1-36-manifest-based-admission-control"]
        - stage: beta
          release: 37

# Out-of-tree SIG Auth subproject. kep.yaml records only `stable: v1.22`.
subprojects:
  - id: secrets-store-csi
    name: Secrets Store CSI Driver
    kep: 2907
    path: sig-auth/2907-secrets-store-csi-driver
    sig: SIG Auth
    coauthors: ["tam7t"]
    stage: ga
    release: 22
    talks:
      - "/talks/2021-kubecon-eu-secrets-store-csi"
      - "/talks/2022-cncf-webinar-secrets-store-csi"
      - "/talks/2023-enlightning-secrets-store-csi"
      - "/talks/2024-you-choose-secrets-management-tools"
      - "/talks/2024-kubecon-na-sig-auth-storage-secrets"
      - "/talks/2025-microsoft-developer-secrets-store-csi"
