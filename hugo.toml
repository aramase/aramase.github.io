baseURL = 'https://anishram.com'
locale = 'en-US'
title = 'Anish Ramasekar'
enableInlineShortcodes = true
buildDrafts = false
buildFuture = false
enableRobotsTXT = true
canonifyURLs = true

# Matches HUGO_VERSION in .github/workflows/hugo.yml.
[module]
  [module.hugoVersion]
    extended = true
    min = '0.168.0'

[params]
  author = "Anish Ramasekar"
  description = "Principal software engineer at Microsoft working on Kubernetes security and on infrastructure for running AI agents. Co-chair of Kubernetes SIG Auth and maintainer of the Secrets Store CSI Driver."
  keywords = ["kubernetes", "security", "authentication", "secrets", "ai agents", "microsoft", "cncf", "talks", "blog"]
  
  [params.social]
    github = "aramase"
    twitter = "AnishRamasekar"
    linkedin = "anishramasekar"
    bluesky = "aramase.bsky.social"
    youtube = "anishramasekar"
    email = "contact@anishram.com"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github-dark"
    codeFences = true
    guessSyntax = true
    lineNos = false
    lineNumbersInTable = false
    noClasses = true
    tabWidth = 4

[taxonomies]
  tag = "tags"

[outputs]
  home = ["HTML", "RSS"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = 'monthly'
  filename = 'sitemap.xml'
  priority = 0.5

[menu]
  [[menu.main]]
    identifier = "work"
    name = "Work"
    url = "/work/"
    weight = 5
  [[menu.main]]
    identifier = "blogs"
    name = "Posts"
    url = "/blogs/"
    weight = 10
  [[menu.main]]
    identifier = "talks"
    name = "Talks"
    url = "/talks/"
    weight = 20
